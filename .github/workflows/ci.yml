name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Check with ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Check with ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --diff --check"

  citation:
    name: Citation Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Validate CITATION.cff
        uses: dieghernan/cff-validator@v5

      - name: Validate .zenodo.json
        uses: vsoch/zenodo-validator@00643f085e550b329ab56bc79da510ba18b2d547

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup the Python venv
        run: uv sync --all-packages --group test

      - name: Run tests
        run: uv run pytest -v

  mypy:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup the Python venv
        run: uv sync --all-packages --group typecheck

      - name: Typecheck numcodecs-random-projection
        run: uv run mypy -p numcodecs_random_projection
