[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "numcodecs-random-projection"
version = "0.1.0"
description = "RandomProjection codec for the `numcodecs` buffer compression API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "leb128~=1.0.8",
    "numcodecs>=0.13.0,<0.17",
    "numpy~=2.0",
    "typing-extensions~=4.6",
    "tqdm~=4.60",
    "types-tqdm~=4.60",
]

[project.optional-dependencies]
dev = [
    "mypy~=1.14",
    "pytest~=8.3",
]

test = [
    "scipy>=1.15.3",
    "xarray>=2025.6.1",
]

[project.entry-points."numcodecs.codecs"]
"rp" = "numcodecs_random_projection:RPCodec"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"numcodecs_random_projection" = ["py.typed"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
xfail_strict = true

[[tool.mypy.overrides]]
module = ["leb128.*", "numcodecs.*"]
follow_untyped_imports = true
